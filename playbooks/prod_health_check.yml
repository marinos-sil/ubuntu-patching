
---
- name: Ubuntu PROD infrastructure and application prechecks
  hosts: prod
  become: true
  gather_facts: true

  vars:
    health_check_stage: ready_for_patch

    docker_host: k-connect

    always_running_containers:
      - kafka-webhook-alerts
      - node_exporter
      - kafka-connect

    manually_managed_containers:
      - nbr-postgres-loader
      - nbr-cdrs-kafka-loader
      - brm2erp_fatal_shutdown
      - brm2erp_6
      - brm2erp_5
      - brm2erp_4
      - brm2erp_3
      - brm2erp_2
      - brm2erp_1

    expected_process_patterns:
      brokers: 'kafka\.Kafka|kafka\.KafkaServer'
      ksql: 'io\.confluent\.ksql'
      schema: 'io\.confluent\.kafka\.schemaregistry'

  tasks:
    - name: Validate health check stage
      ansible.builtin.assert:
        that:
          - health_check_stage in
            ['before_stop', 'ready_for_patch',
             'after_reboot', 'after_start']
        fail_msg: "Invalid health_check_stage"

    - name: Check Ubuntu version
      ansible.builtin.assert:
        that:
          - ansible_distribution == 'Ubuntu'
          - ansible_distribution_version == '24.04'
        fail_msg: >-
          {{ inventory_hostname }} is not Ubuntu 24.04.

    - name: Check root filesystem free space
      ansible.builtin.shell: |
        df -BG / --output=avail | tail -1 | tr -dc '0-9'
      register: root_space
      changed_when: false

    - name: Validate root filesystem free space
      ansible.builtin.assert:
        that:
          - root_space.stdout | int >= 10
        fail_msg: >-
          {{ inventory_hostname }} has less than
          10 GB free on /.

    - name: Collect running process command lines
      ansible.builtin.command:
        cmd: ps -eo args=
      register: running_processes
      changed_when: false

    - name: Check Kafka broker process
      ansible.builtin.assert:
        that:
          - running_processes.stdout is search(
              expected_process_patterns.brokers)
        fail_msg: >-
          Kafka broker process not detected on
          {{ inventory_hostname }}.
      when: inventory_hostname in groups['brokers']

    - name: Check ksqlDB process
      ansible.builtin.assert:
        that:
          - running_processes.stdout is search(
              expected_process_patterns.ksql)
        fail_msg: >-
          ksqlDB process not detected on
          {{ inventory_hostname }}.
      when: inventory_hostname in ['k-ksql-1', 'k-ksql-2']

    - name: Check Schema Registry process
      ansible.builtin.assert:
        that:
          - running_processes.stdout is search(
              expected_process_patterns.schema)
        fail_msg: >-
          Schema Registry process not detected on
          {{ inventory_hostname }}.
      when: inventory_hostname in
        ['schema-reg-1', 'schema-reg-2']

    - name: Check Docker command on k-connect
      ansible.builtin.command:
        cmd: docker info --format '{{ "{{" }}.ServerVersion{{ "}}" }}'
      register: docker_info
      changed_when: false
      when: inventory_hostname == docker_host

    - name: Inspect all expected containers
      ansible.builtin.command:
        argv:
          - docker
          - inspect
          - --format
          - '{{ "{{" }}.State.Running{{ "}}" }}'
          - '{{ item }}'
      loop: >-
        {{ always_running_containers +
           manually_managed_containers }}
      register: container_states
      changed_when: false
      when: inventory_hostname == docker_host

    - name: Validate Docker container states
      ansible.builtin.assert:
        that:
          - item.stdout == expected_state
        fail_msg: >-
          Container {{ item.item }} on {{ inventory_hostname }}
          is running={{ item.stdout }},
          expected={{ expected_state }}.
      vars:
        expected_state: >-
          {{ 'true' if
             (item.item in always_running_containers or
              health_check_stage in ['before_stop', 'after_start'])
             else 'false' }}
      loop: "{{ container_states.results }}"
      when: inventory_hostname == docker_host

    - name: Report host health check
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} passed configured
          infrastructure/process/container checks
          for stage {{ health_check_stage }}.

    - name: State application validation limitation
      ansible.builtin.debug:
        msg: >-
          IMPORTANT: Kafka quorum, ISR, offline partitions,
          Kafka Connect connector/task status, and application
          API health have NOT been validated by this playbook.
          This result alone does not authorize PROD patching.
      run_once: true
