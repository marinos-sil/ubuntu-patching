
---
- name: PROD Ubuntu Rolling Patching
  hosts: prod
  become: true
  gather_facts: true
  serial: 1
  order: inventory

  vars:
    min_root_free_gb: 5
    patch_approved: false
    app_health_checks_approved: false

  pre_tasks:

    - name: Require explicit patch approval
      ansible.builtin.assert:
        that:
          - patch_approved | bool
          - app_health_checks_approved | bool
        fail_msg: >-
          PATCHING BLOCKED. Explicit approval and validated
          application health checks are required.

    - name: Verify Ubuntu 24.04
      ansible.builtin.assert:
        that:
          - ansible_distribution == 'Ubuntu'
          - ansible_distribution_version == '24.04'
        fail_msg: "Unsupported OS on {{ inventory_hostname }}"

    - name: Check root filesystem
      ansible.builtin.set_fact:
        root_mount: >-
          {{ ansible_mounts
             | selectattr('mount', 'equalto', '/')
             | first }}

    - name: Verify available disk space
      ansible.builtin.assert:
        that:
          - (root_mount.size_available | float / 1073741824) >= min_root_free_gb
        fail_msg: "Insufficient disk space on {{ inventory_hostname }}"

    - name: Block until application checks are implemented
      ansible.builtin.fail:
        msg: >-
          Application health gate not implemented for
          {{ inventory_hostname }}. Validate Kafka broker
          quorum/ISR, Kafka Connect, ksqlDB or Schema Registry
          health as appropriate before enabling patching.

  tasks:

    - name: Update APT package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Upgrade installed packages
      ansible.builtin.apt:
        upgrade: safe
        dpkg_options: force-confdef,force-confold
        lock_timeout: 300
      register: upgrade_result

    - name: Check reboot requirement
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Reboot server when required
      ansible.builtin.reboot:
        reboot_timeout: 900
        post_reboot_delay: 30
        msg: "Approved PROD Ubuntu patching reboot"
      when: reboot_required.stat.exists

    - name: Refresh system facts
      ansible.builtin.setup:

    - name: Report OS patching result
      ansible.builtin.debug:
        msg:
          - "Host: {{ inventory_hostname }}"
          - "Upgrade changed packages: {{ upgrade_result.changed }}"
          - "Reboot required after upgrade: {{ reboot_required.stat.exists }}"
          - "Current kernel: {{ ansible_kernel }}"

    - name: Block until post-patch application health is validated
      ansible.builtin.fail:
        msg: >-
          Post-patch application health verification has not
          been implemented. Do not proceed to another server.
