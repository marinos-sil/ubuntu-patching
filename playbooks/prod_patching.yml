
---
- name: Ubuntu PROD Rolling Patching
  hosts: prod
  become: true
  gather_facts: true
  serial: 1

  vars:
    min_free_space_gb: 10
    prod_patching_approved: false

  pre_tasks:

    # ---------------------------------------------------------
    # SAFETY CHECK 0 - Explicit PROD approval
    # ---------------------------------------------------------

    - name: Require explicit PROD patching approval
      ansible.builtin.assert:
        that:
          - prod_patching_approved | bool
        fail_msg: >-
          PROD PATCHING BLOCKED:
          Explicit approval is required.

    # ---------------------------------------------------------
    # SAFETY CHECK 1 - Operating system
    # ---------------------------------------------------------

    - name: Verify Ubuntu
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Ubuntu"
        fail_msg: >-
          Unsupported operating system:
          {{ ansible_distribution }}
          {{ ansible_distribution_version }}

    - name: Verify Ubuntu 24.04 LTS
      ansible.builtin.assert:
        that:
          - ansible_distribution_version == "24.04"
        fail_msg: >-
          Unsupported Ubuntu version:
          {{ ansible_distribution_version }}.
          Expected Ubuntu 24.04 LTS.

    # ---------------------------------------------------------
    # SAFETY CHECK 2 - Disk space
    # ---------------------------------------------------------

    - name: Find root filesystem
      ansible.builtin.set_fact:
        root_mount: >-
          {{ ansible_mounts
             | selectattr('mount', 'equalto', '/')
             | first }}

    - name: Calculate free root space
      ansible.builtin.set_fact:
        root_free_gb: >-
          {{ (root_mount.size_available / 1073741824)
             | round(2) }}

    - name: Verify minimum disk space
      ansible.builtin.assert:
        that:
          - root_free_gb | float >= min_free_space_gb
        fail_msg: >-
          PATCH ABORTED:
          {{ inventory_hostname }} has only
          {{ root_free_gb }} GB free on /.
          Minimum required: {{ min_free_space_gb }} GB.

    # ---------------------------------------------------------
    # SAFETY CHECK 3 - Docker availability
    # ---------------------------------------------------------

    - name: Verify Docker is available
      ansible.builtin.command:
        cmd: docker info
      register: docker_info
      changed_when: false

    - name: Display running Docker containers
      ansible.builtin.command:
        cmd: docker ps --format "{{ '{{' }}.Names{{ '}}' }} {{ '{{' }}.Status{{ '}}' }}"
      register: docker_containers
      changed_when: false

    - name: Show Docker container status
      ansible.builtin.debug:
        var: docker_containers.stdout_lines

    # ---------------------------------------------------------
    # SAFETY CHECK 4 - Application health gate
    # ---------------------------------------------------------

    - name: Block until Kafka application checks are implemented
      ansible.builtin.fail:
        msg: >-
          PROD PATCHING BLOCKED:
          Kafka/Docker application health checks must be
          implemented and validated before patching
          {{ inventory_hostname }}.

  tasks:

    # ---------------------------------------------------------
    # APT CACHE
    # ---------------------------------------------------------

    - name: Update APT package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Check available package updates
      ansible.builtin.command:
        cmd: apt list --upgradable
      register: available_updates
      changed_when: false

    - name: Display available updates
      ansible.builtin.debug:
        var: available_updates.stdout_lines

    # ---------------------------------------------------------
    # PATCH
    # ---------------------------------------------------------

    - name: Upgrade installed packages
      ansible.builtin.apt:
        name: "*"
        state: latest
        update_cache: false
        dpkg_options: force-confdef,force-confold
        lock_timeout: 300
      register: apt_upgrade

    - name: Display patch result
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}:
          Package upgrade completed.
          Changed={{ apt_upgrade.changed }}

    # ---------------------------------------------------------
    # REBOOT CHECK
    # ---------------------------------------------------------

    - name: Check if reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Display reboot requirement
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}:
          Reboot required:
          {{ reboot_required.stat.exists }}

    # ---------------------------------------------------------
    # REBOOT
    # ---------------------------------------------------------

    - name: Reboot server when required
      ansible.builtin.reboot:
        reboot_timeout: 900
        connect_timeout: 10
        pre_reboot_delay: 5
        post_reboot_delay: 30
      when: reboot_required.stat.exists

    # ---------------------------------------------------------
    # POST-CHECK
    # ---------------------------------------------------------

    - name: Gather facts after reboot
      ansible.builtin.setup:

    - name: Display final server state
      ansible.builtin.debug:
        msg:
          - "Hostname: {{ ansible_hostname }}"
          - "Ubuntu: {{ ansible_distribution_version }}"
          - "Kernel: {{ ansible_kernel }}"
          - "Uptime: {{ ansible_uptime_seconds }} seconds"

    - name: Verify Ubuntu after patching
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Ubuntu"
          - ansible_distribution_version == "24.04"
        fail_msg: "Post-patch OS validation failed."
        success_msg: "Post-patch OS validation successful."

    # ---------------------------------------------------------
    # APPLICATION POST-CHECK
    # ---------------------------------------------------------

    - name: Block until Kafka postchecks are implemented
      ansible.builtin.fail:
        msg: >-
          POST-PATCH VALIDATION INCOMPLETE:
          Kafka application health checks must be validated
          before proceeding to the next PROD server.
